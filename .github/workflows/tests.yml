name: Cross-platform Tests

on:
  pull_request:
    branches: ["*"]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
  push:
    branches:
      - "dev"
      - "main"
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  EDAMAME_TARGET: ${{ secrets.EDAMAME_TARGET }}
  EDAMAME_SERVER: ${{ secrets.EDAMAME_SERVER }}
  EDAMAME_SERVER_PEM: ${{ secrets.EDAMAME_SERVER_PEM }}
  EDAMAME_SERVER_KEY: ${{ secrets.EDAMAME_SERVER_KEY }}
  EDAMAME_CA_PEM: ${{ secrets.EDAMAME_CA_PEM }}
  EDAMAME_CLIENT_PEM: ${{ secrets.EDAMAME_CLIENT_PEM }}
  EDAMAME_CLIENT_KEY: ${{ secrets.EDAMAME_CLIENT_KEY }}
  EDAMAME_CLIENT_CA_PEM: ${{ secrets.EDAMAME_CLIENT_CA_PEM }}
  LAMBDA_SIGNATURE: ${{ secrets.LAMBDA_SIGNATURE }}
  # Debug mode
  EDAMAME_LOG_LEVEL: debug

jobs:
  test-native:
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runs-on: ubuntu-latest
            platform: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - os: macos
            # macos-14 is Apple Silicon; we can't use macos-latest because of permissions issues in the network tests
            runs-on: macos-14
            platform: macos
            arch: aarch64
            target: aarch64-apple-darwin
          - os: windows
            runs-on: windows-latest
            platform: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
          - os: macos
            runs-on: macos-latest
            platform: ios
            arch: aarch64
            target: aarch64-apple-ios
          - os: ubuntu
            runs-on: ubuntu-latest
            platform: android
            arch: x86_64
            target: x86_64-linux-android
          - os: ubuntu
            runs-on: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Setup EDAMAME Posture
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          edamame_user: ${{ vars.EDAMAME_POSTURE_USER }}
          edamame_domain: ${{ vars.EDAMAME_POSTURE_DOMAIN }}
          edamame_pin: ${{ secrets.EDAMAME_POSTURE_PIN }}
          edamame_id: ${{ github.run_id }}
          checkout: true
          # Runtime runner protection. See workspace.mdc.
          packet_capture: true
          # NOTE: vulnerability_detection is gated off on Linux because
          # `vulnerability-start` currently hangs on github-hosted ubuntu
          # runners (under investigation). macOS/Windows runners use the
          # full detector. See workspace.mdc.
          vulnerability_detection: ${{ runner.os != 'Linux' }}
          vulnerability_detection_interval: "60"
          agentic_mode: ${{ runner.os != 'Linux' && 'analyze' || 'disabled' }}
          agentic_provider: edamame
          agentic_interval: 600
        env:
          EDAMAME_LLM_API_KEY: ${{ secrets.EDAMAME_LLM_API_KEY }}

      - name: Set ignored paths
        id: set-ignored-paths
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu" ] && [ "${{ matrix.platform }}" != "android" ]; then
            echo "IGNORED_PATHS<<EOF" >> $GITHUB_OUTPUT
            echo "windows/**" >> $GITHUB_OUTPUT
            echo "macos/**" >> $GITHUB_OUTPUT
            echo "ios/**" >> $GITHUB_OUTPUT
            echo "android/**" >> $GITHUB_OUTPUT
            echo "src/*windows*.rs" >> $GITHUB_OUTPUT
            echo "src/*macos*.rs" >> $GITHUB_OUTPUT
            echo "src/*ios*.rs" >> $GITHUB_OUTPUT
            echo "src/*android*.rs" >> $GITHUB_OUTPUT
            echo ".github/workflows/*windows*.yml" >> $GITHUB_OUTPUT
            echo ".github/workflows/*macos*.yml" >> $GITHUB_OUTPUT
            echo ".github/workflows/*ios*.yml" >> $GITHUB_OUTPUT
            echo ".github/workflows/*android*.yml" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.os }}" = "macos" ] && [ "${{ matrix.platform }}" != "ios" ]; then
            echo "IGNORED_PATHS<<EOF" >> $GITHUB_OUTPUT
            echo "windows/**" >> $GITHUB_OUTPUT
            echo "linux/**" >> $GITHUB_OUTPUT
            echo "snap/**" >> $GITHUB_OUTPUT
            echo "android/**" >> $GITHUB_OUTPUT
            echo "ios/**" >> $GITHUB_OUTPUT
            echo "src/*windows*.rs" >> $GITHUB_OUTPUT
            echo "src/*linux*.rs" >> $GITHUB_OUTPUT
            echo "src/*android*.rs" >> $GITHUB_OUTPUT
            echo "src/*ios*.rs" >> $GITHUB_OUTPUT
            echo ".github/workflows/*windows*.yml" >> $GITHUB_OUTPUT
            echo ".github/workflows/*linux*.yml" >> $GITHUB_OUTPUT
            echo ".github/workflows/*android*.yml" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.os }}" = "windows" ]; then
            echo "IGNORED_PATHS<<EOF" >> $GITHUB_OUTPUT
            echo "linux/**" >> $GITHUB_OUTPUT
            echo "snap/**" >> $GITHUB_OUTPUT
            echo "macos/**" >> $GITHUB_OUTPUT
            echo "ios/**" >> $GITHUB_OUTPUT
            echo "android/**" >> $GITHUB_OUTPUT
            echo "src/*linux*.rs" >> $GITHUB_OUTPUT
            echo "src/*macos*.rs" >> $GITHUB_OUTPUT
            echo "src/*ios*.rs" >> $GITHUB_OUTPUT
            echo "src/*android*.rs" >> $GITHUB_OUTPUT
            echo ".github/workflows/*linux*.yml" >> $GITHUB_OUTPUT
            echo ".github/workflows/*macos*.yml" >> $GITHUB_OUTPUT
            echo ".github/workflows/*ios*.yml" >> $GITHUB_OUTPUT
            echo ".github/workflows/*android*.yml" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.platform }}" = "ios" ]; then
            echo "IGNORED_PATHS<<EOF" >> $GITHUB_OUTPUT
            echo "windows/**" >> $GITHUB_OUTPUT
            echo "linux/**" >> $GITHUB_OUTPUT
            echo "snap/**" >> $GITHUB_OUTPUT
            echo "android/**" >> $GITHUB_OUTPUT
            echo "src/*windows*.rs" >> $GITHUB_OUTPUT
            echo "src/*linux*.rs" >> $GITHUB_OUTPUT
            echo "src/*android*.rs" >> $GITHUB_OUTPUT
            echo ".github/workflows/*windows*.yml" >> $GITHUB_OUTPUT
            echo ".github/workflows/*linux*.yml" >> $GITHUB_OUTPUT
            echo ".github/workflows/*android*.yml" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.platform }}" = "android" ]; then
            echo "IGNORED_PATHS<<EOF" >> $GITHUB_OUTPUT
            echo "windows/**" >> $GITHUB_OUTPUT
            echo "macos/**" >> $GITHUB_OUTPUT
            echo "ios/**" >> $GITHUB_OUTPUT
            echo "src/*windows*.rs" >> $GITHUB_OUTPUT
            echo "src/*macos*.rs" >> $GITHUB_OUTPUT
            echo "src/*ios*.rs" >> $GITHUB_OUTPUT
            echo ".github/workflows/*windows*.yml" >> $GITHUB_OUTPUT
            echo ".github/workflows/*macos*.yml" >> $GITHUB_OUTPUT
            echo ".github/workflows/*ios*.yml" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Set Rust toolchain
        shell: bash
        run: |
          # For ebpf
          rustup toolchain install nightly --component rust-src
          rustup component add --toolchain nightly llvm-tools-preview
          # Use nightly by default so that build.rs picks it up automatically
          echo "RUSTUP_TOOLCHAIN=nightly" >> $HOME/.cargo/env

      - name: iOS add-ons
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          rustup target add aarch64-apple-ios

      - name: Android add-ons
        if: matrix.platform == 'android'
        shell: bash
        run: |
          rustup target add x86_64-linux-android
          cargo install cross

      - name: Install protobuf (with apt lock handling)
        shell: bash
        run: |
          set -e
          if [ "${{ matrix.os }}" = "ubuntu" ]; then
            wait_for_apt_locks() {
              echo "Checking for apt/dpkg locks..."
              local TIMEOUT=300
              local TIME_PASSED=0
              local LOCK_FILES=(
                "/var/lib/apt/lists/lock"
                "/var/lib/dpkg/lock-frontend"
                "/var/lib/dpkg/lock"
                "/var/cache/apt/archives/lock"
              )
              
              while [ $TIME_PASSED -lt $TIMEOUT ]; do
                local LOCKED=false
                
                if command -v fuser >/dev/null 2>&1; then
                  for lock_file in "${LOCK_FILES[@]}"; do
                    if [ -f "$lock_file" ] && sudo fuser "$lock_file" >/dev/null 2>&1; then
                      LOCKED=true
                      echo "  Lock held: $lock_file"
                      break
                    fi
                  done
                fi
                
                if [ "$LOCKED" = "false" ]; then
                  if ! sudo dpkg --configure -a 2>/dev/null; then
                    LOCKED=true
                  fi
                fi
                
                if [ "$LOCKED" = "false" ]; then
                  echo "No apt/dpkg locks held, proceeding..."
                  return 0
                fi
                
                echo "Waiting for apt/dpkg locks to be released... ($TIME_PASSED/${TIMEOUT}s)"
                sleep 5
                TIME_PASSED=$((TIME_PASSED + 5))
              done
              
              echo "Timed out waiting for apt/dpkg locks after $TIMEOUT seconds."
              return 1
            }

            run_apt() {
              local MAX_ATTEMPTS=10
              local ATTEMPTS=0
              if command -v sudo >/dev/null 2>&1; then PREFIX="sudo -E "; else PREFIX=""; fi
              
              while [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
                ATTEMPTS=$((ATTEMPTS + 1))
                echo "apt-get $* (attempt $ATTEMPTS/$MAX_ATTEMPTS)"
                
                if ! wait_for_apt_locks; then
                  sleep 5
                  continue
                fi
                
                if $PREFIX apt-get "$@"; then
                  return 0
                fi
                
                RC=$?
                echo "apt-get $* failed (rc=$RC)"
                if [ $RC -eq 100 ]; then
                  sudo dpkg --configure -a || true
                fi
                sleep 5
              done
              
              echo "apt-get $* failed after $MAX_ATTEMPTS attempts"
              return 1
            }

            export DEBIAN_FRONTEND=noninteractive
            echo "Waiting for any background apt processes to complete..."
            wait_for_apt_locks
            
            run_apt update -y
            run_apt install -y protobuf-compiler libpcap-dev
            
            # eBPF development tools for L7 process resolution (REQUIRED for eBPF compilation)
            run_apt install -y clang llvm libbpf-dev
            run_apt install -y linux-headers-$(uname -r) || true
          elif [ "${{ matrix.os }}" = "macos" ]; then
            brew install protobuf
          elif [ "${{ matrix.os }}" = "windows" ]; then
            choco install protoc
          else
            # linux or other platforms: fall back to matrix command
            echo "Unsupported platform: ${{ matrix.os }}"
            exit 1
          fi

      - name: Install Npcap (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $npcapDir = "C:\Windows\System32\Npcap"
          if (Test-Path "$npcapDir\wpcap.dll") {
            Write-Host "Npcap already installed at $npcapDir"
            exit 0
          }
          $installer = "$env:TEMP\npcap-installer.exe"
          $urls = @(
            "https://web.archive.org/web/20220523140209id_/https://npcap.com/dist/npcap-0.96.exe",
            "https://npcap.com/dist/npcap-0.96.exe"
          )
          $downloaded = $false
          foreach ($url in $urls) {
            Write-Host "Trying: $url"
            try {
              Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing -TimeoutSec 60
              $bytes = [System.IO.File]::ReadAllBytes($installer)
              if ($bytes[0] -eq 0x4D -and $bytes[1] -eq 0x5A) {
                Write-Host "Downloaded $($bytes.Length) bytes (valid PE)"
                $downloaded = $true
                break
              }
              Write-Host "Invalid PE header, trying next URL"
            } catch {
              Write-Host "Download failed: $_"
            }
          }
          if (-not $downloaded) {
            Write-Host "::warning::Could not download Npcap installer"
            exit 0
          }
          Write-Host "Running installer with /S..."
          $proc = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru -NoNewWindow
          Write-Host "Installer exit code: $($proc.ExitCode)"
          $retries = 0
          while (-not (Test-Path "$npcapDir\wpcap.dll") -and $retries -lt 30) {
            Start-Sleep -Seconds 2
            $retries++
          }
          if (Test-Path "$npcapDir\wpcap.dll") {
            Write-Host "Npcap installed successfully at $npcapDir"
            Get-ChildItem $npcapDir | ForEach-Object { Write-Host "  $($_.Name)" }
          } else {
            Write-Host "::warning::Npcap DLL not found after install -- capture tests may fail"
            Write-Host "Checking if driver was registered..."
            sc.exe query npcap 2>&1 | ForEach-Object { Write-Host "  $_" }
          }
          Remove-Item -Force $installer -ErrorAction SilentlyContinue

      - name: Configure Windows clang-cl toolchain
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $clang = 'C:\Program Files\LLVM\bin\clang-cl.exe'
          $llvmLib = 'C:\Program Files\LLVM\bin\llvm-lib.exe'
          if (!(Test-Path $clang) -or !(Test-Path $llvmLib)) {
            choco install llvm -y
          }
          if (!(Test-Path $clang) -or !(Test-Path $llvmLib)) {
            throw "LLVM Windows toolchain not found"
          }
          "CC_x86_64_pc_windows_msvc=$clang" >> $env:GITHUB_ENV
          "CXX_x86_64_pc_windows_msvc=$clang" >> $env:GITHUB_ENV
          "AR_x86_64_pc_windows_msvc=$llvmLib" >> $env:GITHUB_ENV

      - name: Run eBPF Diagnostic Test
        id: ebpf_test
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: ./tests/ebpf_test.sh
        continue-on-error: true

      - name: Run tests
        id: tests
        shell: bash
        run: |
          make ${{ matrix.platform }}_test
        continue-on-error: true

      - name: Dump logs
        if: always()
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macos" ] || [ "${{ runner.os }}" = "linux" ]; then
            SUDO="sudo"
          else
            SUDO=""
          fi
          echo "--- Dumping Native Logs (${{ matrix.os }}-${{ matrix.platform }}) --- "
          find . -name "edamame_*.2*-*-*" -exec echo "--- {} ---" \; -exec $SUDO cat {} \; || echo "No logs found in default directory"
          if [ -d /var/log/edamame ]; then
            echo "--- Dumping /var/log/edamame/ ---"
            find /var/log/edamame -name "edamame_*.2*-*-*" -exec echo "--- {} ---" \; -exec $SUDO cat {} \; || echo "No logs found in /var/log/edamame"
          fi
          echo "--- Native Log Dump Complete ---"

      - name: EDAMAME Posture vulnerability gate
        if: always()
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          dump_vulnerability_findings: true
          exit_on_vulnerability_findings: true

      - name: Slack alerts
        if: steps.tests.outcome != 'success' || (steps.ebpf_test.outcome == 'failure' && matrix.platform == 'linux')
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: "C072J0U9TH7"
          slack-message: |
            *Native Test Results for ${{ github.repository }} (${{ matrix.os }}-${{ matrix.arch }})*:
            - Tests: ${{ steps.tests.outcome == 'success' && '✅ Success' || '❌ Failed' }}
            - eBPF Test: ${{ steps.ebpf_test.outcome != 'failure' && '✅ Success' || '❌ Failed' }}
            Branch: ${{ github.ref }}
            More details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Fail job if tests failed
        if: steps.tests.outcome != 'success' || (steps.ebpf_test.outcome == 'failure' && matrix.platform == 'linux')
        shell: bash
        run: |
          echo "## Test Results Summary (Native - ${{ matrix.os }}-${{ matrix.platform }})"
          echo "- Tests: ${{ steps.tests.outcome == 'success' && '✅ Success' || '❌ Failed' }}"
          echo "- eBPF Test: ${{ steps.ebpf_test.outcome != 'failure' && '✅ Success' || '❌ Failed' }}"
          echo ""
          echo "Forcing job to fail because tests did not succeed."
          exit 1

  test-container:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Container-based tests for older Ubuntu versions
          - os: ubuntu
            runs-on: ubuntu-latest
            container_image: ubuntu:20.04
            container_name: ubuntu-20.04
            platform: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu
            runs-on: ubuntu-latest
            container_image: ubuntu:18.04
            container_name: ubuntu-18.04
            platform: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu
            runs-on: ubuntu-latest
            container_image: alpine:3.20
            container_name: alpine-3.20-x86_64-musl
            platform: linux
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - os: ubuntu
            runs-on: ubuntu-24.04-arm
            container_image: alpine:3.20
            container_name: alpine-3.20-aarch64-musl
            platform: linux
            arch: aarch64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runs-on }}
    container:
      image: ${{ matrix.container_image }}
      # Needed for integration tests (pcap) and eBPF (kprobes require SYS_ADMIN/BPF capabilities)
      options: --cap-add=NET_ADMIN --cap-add=NET_RAW --cap-add=SYS_ADMIN --cap-add=SYS_PTRACE --cap-add=BPF

    env:
      CARGO_TERM_COLOR: always
      EDAMAME_TARGET: ${{ secrets.EDAMAME_TARGET }}
      EDAMAME_SERVER: ${{ secrets.EDAMAME_SERVER }}
      EDAMAME_SERVER_PEM: ${{ secrets.EDAMAME_SERVER_PEM }}
      EDAMAME_SERVER_KEY: ${{ secrets.EDAMAME_SERVER_KEY }}
      EDAMAME_CA_PEM: ${{ secrets.EDAMAME_CA_PEM }}
      EDAMAME_CLIENT_PEM: ${{ secrets.EDAMAME_CLIENT_PEM }}
      EDAMAME_CLIENT_KEY: ${{ secrets.EDAMAME_CLIENT_KEY }}
      EDAMAME_CLIENT_CA_PEM: ${{ secrets.EDAMAME_CLIENT_CA_PEM }}
      LAMBDA_SIGNATURE: ${{ secrets.LAMBDA_SIGNATURE }}
      # Debug mode
      EDAMAME_LOG_LEVEL: debug

    steps:
      # Needed when we are running in a container
      - name: Setup permissions for git and install missing packages (apk)
        if: ${{ contains(matrix.container_image, 'alpine') }}
        shell: sh
        run: |
          apk update
          apk add --no-cache build-base git curl bash sudo pkgconf
          git config --global --add safe.directory '*'

      - name: Setup permissions for git and install missing packages (apt)
        if: ${{ !contains(matrix.container_image, 'alpine') }}
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          echo 'Acquire::ForceIPv4 "true";' > /etc/apt/apt.conf.d/99force-ipv4
          # In-process apt retries on individual URL fetch failures
          # (per-mirror transient drops). Independent of the outer
          # apt_retry() loop which retries the whole apt-get invocation.
          echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/99retries

          # Note: archive.ubuntu.com / security.ubuntu.com still serve
          # bionic (18.04) and focal (20.04) Release files; do NOT
          # redirect to old-releases.ubuntu.com -- that mirror does NOT
          # have bionic at the standard /ubuntu/dists/<codename>/Release
          # path and returns 404. The original prep-step failures were
          # transient "Connection failed" drops to Canonical mirror IPs;
          # they resolve on retry with longer backoff.

          apt_retry() {
            local max=8 attempt=1
            while [ $attempt -le $max ]; do
              echo "apt-get $* (attempt $attempt/$max)"
              if apt-get "$@"; then return 0; fi
              local backoff=$(( attempt * 30 ))
              [ $backoff -gt 300 ] && backoff=300
              echo "Failed, sleeping ${backoff}s before retry..."
              sleep "$backoff"
              attempt=$((attempt + 1))
            done
            return 1
          }
          apt_retry update -y || apt_retry update -y --fix-missing
          apt_retry install -y --fix-missing git curl
          git config --global --add safe.directory '*'

      - name: Setup EDAMAME Posture
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          edamame_user: ${{ vars.EDAMAME_POSTURE_USER }}
          edamame_domain: ${{ vars.EDAMAME_POSTURE_DOMAIN }}
          edamame_pin: ${{ secrets.EDAMAME_POSTURE_PIN }}
          edamame_id: ${{ github.run_id }}-container-${{ matrix.container_name }}
          # Don't checkout the repo, as we will do that in the next step
          checkout: false
          wait_for_api: true
          wait_for_https: true
          # Runtime runner protection. Inside Docker containers
          # packet_capture has limited host visibility but FIM and
          # process introspection still detect tampering / exfil.
          packet_capture: true
          # NOTE: vulnerability_detection is gated off on Linux because
          # `vulnerability-start` currently hangs on github-hosted ubuntu
          # runners (under investigation). macOS/Windows runners use the
          # full detector. See workspace.mdc.
          vulnerability_detection: ${{ runner.os != 'Linux' }}
          vulnerability_detection_interval: "60"
          agentic_mode: ${{ runner.os != 'Linux' && 'analyze' || 'disabled' }}
          agentic_provider: edamame
          agentic_interval: 600
        env:
          EDAMAME_LLM_API_KEY: ${{ secrets.EDAMAME_LLM_API_KEY }}

      # Manual checkout for containers (actions/checkout@v4 requires node20 which is not supported on older Ubuntu containers)
      - name: Manual checkout for containers
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          git clone https://github.com/${{ github.repository }}.git .
          git checkout "${{ github.head_ref || github.ref_name }}"

      - name: Install additional packages (apk)
        if: ${{ contains(matrix.container_image, 'alpine') }}
        shell: sh
        run: |
          apk add --no-cache protobuf-dev libpcap-dev
          # eBPF development tools for L7 process resolution (REQUIRED for eBPF compilation)
          apk add --no-cache clang llvm
          # libbpf-dev and linux-headers (optional, may not be available in older Alpine)
          apk add --no-cache libbpf-dev linux-headers || true

      - name: Install additional packages (apt)
        if: ${{ !contains(matrix.container_image, 'alpine') }}
        shell: bash
        run: |
          apt-get update
          apt-get install -y protobuf-compiler libpcap-dev software-properties-common
          # eBPF development tools for L7 process resolution (REQUIRED for eBPF compilation)
          apt-get install -y clang llvm
          # libbpf-dev (optional, may not be available in older Ubuntu like 18.04)
          apt-get install -y libbpf-dev || true
          
          # Install GCC 10+ on Ubuntu 20.04 to fix aws-lc-sys memcmp bug (GCC bug #95189)
          # Ubuntu 20.04 ships with GCC 9 which has a known memcmp optimization bug.
          #
          # First try the universe repo (gcc-10 is there as 10.3.0). Only fall
          # back to the ubuntu-toolchain-r PPA if universe doesn't ship it.
          # Launchpad has had repeated outages on that PPA which fail the job
          # with "PPAException: ... Service Unavailable" or
          # "ERROR: '~ubuntu-toolchain-r' user or team does not exist." Both
          # of those are transient infrastructure errors unrelated to the
          # compilation fix we actually need.
          if grep -q "20.04" /etc/os-release 2>/dev/null; then
            echo "Detected Ubuntu 20.04 - installing GCC 10 to fix aws-lc-sys compilation"
            apt-get install -y gcc-10 g++-10 || {
              echo "gcc-10 not available in default repos, falling back to ubuntu-toolchain-r PPA"
              add-apt-repository -y ppa:ubuntu-toolchain-r/test
              apt-get update
              apt-get install -y gcc-10 g++-10
            }
            # Set GCC 10 as the default compiler
            update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 100
            update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-10 100
            update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-10 100
            update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-10 100
            echo "GCC version after update:"
            gcc --version
          fi

      # Install Rust in container
      - name: Install Rust in container
        shell: bash
        run: |
          if [ -f /etc/alpine-release ]; then
            apk add --no-cache build-base
          fi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          # Add rust to path for subsequent steps
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Run eBPF Diagnostic Test
        id: ebpf_test
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          ./tests/ebpf_test.sh
        continue-on-error: true

      - name: Run tests
        id: tests
        shell: bash
        run: |
          # Ensure cargo is in path
          export PATH="$HOME/.cargo/bin:$PATH"
          make ${{ matrix.platform }}_test
        continue-on-error: true

      - name: Dump logs
        if: always()
        shell: bash
        run: |
          echo "--- Dumping Container Logs (${{ matrix.container_name }}) --- "
          find . -name "edamame_*.2*-*-*" -exec echo "--- {} ---" \; -exec sudo cat {} \; || echo "No logs found in default directory"
          if [ -d /var/log/edamame ]; then
            echo "--- Dumping /var/log/edamame/ ---"
            find /var/log/edamame -name "edamame_*.2*-*-*" -exec echo "--- {} ---" \; -exec sudo cat {} \; || echo "No logs found in /var/log/edamame"
          fi
          echo "--- Container Log Dump Complete ---"

      - name: EDAMAME Posture vulnerability gate
        if: always()
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          dump_vulnerability_findings: true
          exit_on_vulnerability_findings: true

      - name: Slack alerts
        # Won't work on 18.04 because of glibc version
        # Won't work on ARM64 Alpine because of JavaScript support
        # eBPF test failure only matters if NOT on 18.04 (which doesn't support eBPF well)
        if: (steps.tests.outcome != 'success' || (steps.ebpf_test.outcome == 'failure' && !contains(matrix.container_name, '18.04'))) && !contains(matrix.container_name, '18.04') && !contains(matrix.container_name, 'aarch64-musl')
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: "C072J0U9TH7"
          slack-message: |
            *Container Test Results for ${{ github.repository }} (${{ matrix.container_name }})*:
            - Tests: ${{ steps.tests.outcome == 'success' && '✅ Success' || '❌ Failed' }}
            - eBPF Test: ${{ steps.ebpf_test.outcome != 'failure' && '✅ Success' || '❌ Failed' }}
            Branch: ${{ github.ref }}
            More details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Fail job if tests failed
        # eBPF test failure only matters if NOT on 18.04 (which doesn't support eBPF well)
        if: steps.tests.outcome != 'success' || (steps.ebpf_test.outcome == 'failure' && !contains(matrix.container_name, '18.04'))
        shell: bash
        run: |
          echo "## Test Results Summary (Container - ${{ matrix.container_name }})"
          echo "- Tests: ${{ steps.tests.outcome == 'success' && '✅ Success' || '❌ Failed' }}"
          echo "- eBPF Test: ${{ steps.ebpf_test.outcome != 'failure' && '✅ Success' || '❌ Failed' }}"
          echo ""
          echo "Forcing container job to fail because tests did not succeed."
          exit 1

