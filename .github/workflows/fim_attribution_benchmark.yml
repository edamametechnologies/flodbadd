name: FIM Attribution Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - "src/fim*.rs"
      - "src/l7_es.rs"
      - "tests/fim_attribution_benchmark_test.rs"
      - ".github/workflows/fim_attribution_benchmark.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  EDAMAME_TARGET: ${{ secrets.EDAMAME_TARGET }}
  EDAMAME_SERVER: ${{ secrets.EDAMAME_SERVER }}
  EDAMAME_SERVER_PEM: ${{ secrets.EDAMAME_SERVER_PEM }}
  EDAMAME_SERVER_KEY: ${{ secrets.EDAMAME_SERVER_KEY }}
  EDAMAME_CA_PEM: ${{ secrets.EDAMAME_CA_PEM }}
  EDAMAME_CLIENT_PEM: ${{ secrets.EDAMAME_CLIENT_PEM }}
  EDAMAME_CLIENT_KEY: ${{ secrets.EDAMAME_CLIENT_KEY }}
  EDAMAME_CLIENT_CA_PEM: ${{ secrets.EDAMAME_CLIENT_CA_PEM }}
  LAMBDA_SIGNATURE: ${{ secrets.LAMBDA_SIGNATURE }}
  EDAMAME_LOG_LEVEL: debug

jobs:
  benchmark-macos:
    name: fim-benchmark-macos
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Setup EDAMAME Posture
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          edamame_user: ${{ vars.EDAMAME_POSTURE_USER }}
          edamame_domain: ${{ vars.EDAMAME_POSTURE_DOMAIN }}
          edamame_pin: ${{ secrets.EDAMAME_POSTURE_PIN }}
          edamame_id: ${{ github.run_id }}-fim
          checkout: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-apple-darwin

      - name: Set Rust toolchain
        shell: bash
        run: |
          rustup toolchain install nightly --component rust-src
          rustup component add --toolchain nightly llvm-tools-preview
          echo "RUSTUP_TOOLCHAIN=nightly" >> "$GITHUB_ENV"

      - name: Install protobuf
        shell: bash
        run: brew install protobuf

      - name: Install ES provisioning profile
        shell: bash
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "${{ secrets.APPLE_ES_HELPER_PROVISIONING_PROFILE }}" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/EDAMAME_Helper.provisionprofile"

      - name: Build and codesign FIM benchmark with ES entitlement
        shell: bash
        run: |
          cargo test --features endpointsecurity,fim --test fim_attribution_benchmark_test --no-run 2>&1
          cat > /tmp/es_bench.entitlements << 'ENTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.endpoint-security.client</key>
            <true/>
          </dict>
          </plist>
          ENTEOF
          for binary in target/debug/deps/fim_attribution_benchmark_test-*; do
            if [ -x "$binary" ] && [[ ! "$binary" == *.d ]] && [[ ! "$binary" == *.o ]]; then
              echo "Signing $binary with ES entitlement"
              codesign --force --sign - --entitlements /tmp/es_bench.entitlements "$binary"
              codesign -dvvv "$binary" 2>&1 | head -5
            fi
          done

      - name: FIM benchmark with Endpoint Security
        id: benchmark_with_es
        shell: bash
        continue-on-error: true
        run: |
          BENCH_BIN=$(find target/debug/deps -name 'fim_attribution_benchmark_test-*' -perm +111 ! -name '*.d' ! -name '*.o' | head -1)
          echo "Running signed binary: $BENCH_BIN"
          sudo -E "$BENCH_BIN" --nocapture 2>&1 | tee fim_benchmark_with_es.log

      - name: FIM benchmark without Endpoint Security
        id: benchmark_no_es
        shell: bash
        continue-on-error: true
        run: |
          make macos_fim_benchmark_no_es 2>&1 | tee fim_benchmark_no_es.log

      - name: Extract benchmark JSON from logs
        if: always()
        shell: bash
        run: |
          extract_json() {
            local log="$1"
            local out="$2"
            if [[ -f "$log" ]] && grep -q BENCHMARK_JSON_START "$log" 2>/dev/null; then
              awk '/BENCHMARK_JSON_START/{flag=1;next}/BENCHMARK_JSON_END/{flag=0}flag' "$log" > "$out"
            else
              echo '{}' > "$out"
            fi
          }
          extract_json fim_benchmark_with_es.log fim_benchmark_with_es.json
          extract_json fim_benchmark_no_es.log fim_benchmark_no_es.json

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fim-benchmark-macos-${{ github.run_id }}
          path: |
            fim_benchmark_with_es.log
            fim_benchmark_no_es.log
            fim_benchmark_with_es.json
            fim_benchmark_no_es.json

      - name: Slack alert on failure
        if: failure()
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: "C072J0U9TH7"
          slack-message: |
            *FIM Attribution Benchmark (macos) failed for ${{ github.repository }}*
            - With ES: ${{ steps.benchmark_with_es.outcome }}
            - Without ES: ${{ steps.benchmark_no_es.outcome }}
            Branch: ${{ github.ref }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
