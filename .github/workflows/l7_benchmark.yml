name: L7 Attribution Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - "src/l7*.rs"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  EDAMAME_TARGET: ${{ secrets.EDAMAME_TARGET }}
  EDAMAME_SERVER: ${{ secrets.EDAMAME_SERVER }}
  EDAMAME_SERVER_PEM: ${{ secrets.EDAMAME_SERVER_PEM }}
  EDAMAME_SERVER_KEY: ${{ secrets.EDAMAME_SERVER_KEY }}
  EDAMAME_CA_PEM: ${{ secrets.EDAMAME_CA_PEM }}
  EDAMAME_CLIENT_PEM: ${{ secrets.EDAMAME_CLIENT_PEM }}
  EDAMAME_CLIENT_KEY: ${{ secrets.EDAMAME_CLIENT_KEY }}
  EDAMAME_CLIENT_CA_PEM: ${{ secrets.EDAMAME_CLIENT_CA_PEM }}
  LAMBDA_SIGNATURE: ${{ secrets.LAMBDA_SIGNATURE }}
  EDAMAME_LOG_LEVEL: debug

jobs:
  benchmark-linux:
    name: benchmark-linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Setup EDAMAME Posture
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          edamame_user: ${{ vars.EDAMAME_POSTURE_USER }}
          edamame_domain: ${{ vars.EDAMAME_POSTURE_DOMAIN }}
          edamame_pin: ${{ secrets.EDAMAME_POSTURE_PIN }}
          edamame_id: ${{ github.run_id }}
          checkout: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Set Rust toolchain
        shell: bash
        run: |
          rustup toolchain install nightly --component rust-src
          rustup component add --toolchain nightly llvm-tools-preview
          echo "RUSTUP_TOOLCHAIN=nightly" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        shell: bash
        run: |
          set -e
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y protobuf-compiler libpcap-dev clang llvm libbpf-dev lsof
          sudo apt-get install -y "linux-headers-$(uname -r)" || true

      - name: eBPF environment setup
        shell: bash
        run: make ebpf_setup

      - name: L7 benchmark with eBPF
        id: benchmark_with_ebpf
        shell: bash
        continue-on-error: true
        run: |
          make linux_benchmark 2>&1 | tee benchmark_with_ebpf.log

      - name: L7 benchmark without eBPF
        id: benchmark_no_ebpf
        shell: bash
        continue-on-error: true
        run: |
          make linux_benchmark_no_ebpf 2>&1 | tee benchmark_no_ebpf.log

      - name: Extract benchmark JSON from logs
        if: always()
        shell: bash
        run: |
          extract_json() {
            local log="$1"
            local out="$2"
            if [[ -f "$log" ]] && grep -q BENCHMARK_JSON_START "$log" 2>/dev/null; then
              awk '/BENCHMARK_JSON_START/{flag=1;next}/BENCHMARK_JSON_END/{flag=0}flag' "$log" > "$out"
            else
              echo '{}' > "$out"
            fi
          }
          extract_json benchmark_with_ebpf.log benchmark_with_ebpf.json
          extract_json benchmark_no_ebpf.log benchmark_no_ebpf.json

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l7-benchmark-linux-${{ github.run_id }}
          path: |
            benchmark_with_ebpf.log
            benchmark_no_ebpf.log
            benchmark_with_ebpf.json
            benchmark_no_ebpf.json

      - name: Slack alert on failure
        if: failure()
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: "C072J0U9TH7"
          slack-message: |
            *L7 Attribution Benchmark (linux) failed for ${{ github.repository }}*
            - With eBPF: ${{ steps.benchmark_with_ebpf.outcome }}
            - Without eBPF: ${{ steps.benchmark_no_ebpf.outcome }}
            Branch: ${{ github.ref }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  benchmark-macos:
    name: benchmark-macos
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Setup EDAMAME Posture
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          edamame_user: ${{ vars.EDAMAME_POSTURE_USER }}
          edamame_domain: ${{ vars.EDAMAME_POSTURE_DOMAIN }}
          edamame_pin: ${{ secrets.EDAMAME_POSTURE_PIN }}
          edamame_id: ${{ github.run_id }}-macos
          checkout: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-apple-darwin

      - name: Set Rust toolchain
        shell: bash
        run: |
          rustup toolchain install nightly --component rust-src
          rustup component add --toolchain nightly llvm-tools-preview
          echo "RUSTUP_TOOLCHAIN=nightly" >> "$GITHUB_ENV"

      - name: Install protobuf
        shell: bash
        run: brew install protobuf

      - name: Build and codesign benchmark binary with ES entitlement
        shell: bash
        run: |
          cargo test --features packetcapture,asyncpacketcapture,endpointsecurity --test l7_benchmark_test --no-run 2>&1
          cat > /tmp/es_bench.entitlements << 'ENTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.endpoint-security.client</key>
            <true/>
          </dict>
          </plist>
          ENTEOF
          for binary in target/debug/deps/l7_benchmark_test-*; do
            if [ -x "$binary" ] && [[ ! "$binary" == *.d ]] && [[ ! "$binary" == *.o ]]; then
              echo "Signing $binary with ES entitlement"
              codesign --force --sign - --entitlements /tmp/es_bench.entitlements "$binary"
              codesign -dvvv "$binary" 2>&1 | head -5
            fi
          done

      - name: L7 benchmark with Endpoint Security
        id: benchmark_with_es
        shell: bash
        continue-on-error: true
        run: |
          sudo -E cargo test --features packetcapture,asyncpacketcapture,endpointsecurity --test l7_benchmark_test -- --nocapture 2>&1 | tee benchmark_with_es.log

      - name: L7 benchmark without Endpoint Security
        id: benchmark_no_es
        shell: bash
        continue-on-error: true
        run: |
          make macos_benchmark_no_es 2>&1 | tee benchmark_no_es.log

      - name: Extract benchmark JSON from logs
        if: always()
        shell: bash
        run: |
          extract_json() {
            local log="$1"
            local out="$2"
            if [[ -f "$log" ]] && grep -q BENCHMARK_JSON_START "$log" 2>/dev/null; then
              awk '/BENCHMARK_JSON_START/{flag=1;next}/BENCHMARK_JSON_END/{flag=0}flag' "$log" > "$out"
            else
              echo '{}' > "$out"
            fi
          }
          extract_json benchmark_with_es.log benchmark_with_es.json
          extract_json benchmark_no_es.log benchmark_no_es.json

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l7-benchmark-macos-${{ github.run_id }}
          path: |
            benchmark_with_es.log
            benchmark_no_es.log
            benchmark_with_es.json
            benchmark_no_es.json

      - name: Slack alert on failure
        if: failure()
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: "C072J0U9TH7"
          slack-message: |
            *L7 Attribution Benchmark (macos) failed for ${{ github.repository }}*
            - With ES: ${{ steps.benchmark_with_es.outcome }}
            - Without ES: ${{ steps.benchmark_no_es.outcome }}
            Branch: ${{ github.ref }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  benchmark-windows:
    name: benchmark-windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Setup EDAMAME Posture
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          edamame_user: ${{ vars.EDAMAME_POSTURE_USER }}
          edamame_domain: ${{ vars.EDAMAME_POSTURE_DOMAIN }}
          edamame_pin: ${{ secrets.EDAMAME_POSTURE_PIN }}
          edamame_id: ${{ github.run_id }}-windows
          checkout: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set Rust toolchain
        shell: bash
        run: |
          rustup toolchain install nightly --component rust-src
          rustup component add --toolchain nightly llvm-tools-preview
          echo "RUSTUP_TOOLCHAIN=nightly" >> "$GITHUB_ENV"

      - name: Install protoc
        shell: bash
        run: choco install protoc -y

      - name: L7 benchmark with ETW
        id: benchmark_with_etw
        shell: bash
        continue-on-error: true
        run: |
          make windows_benchmark 2>&1 | tee benchmark_with_etw.log

      - name: L7 benchmark without ETW
        id: benchmark_no_etw
        shell: bash
        continue-on-error: true
        run: |
          make windows_benchmark_no_etw 2>&1 | tee benchmark_no_etw.log

      - name: Extract benchmark JSON from logs
        if: always()
        shell: bash
        run: |
          extract_json() {
            local log="$1"
            local out="$2"
            if [[ -f "$log" ]] && grep -q BENCHMARK_JSON_START "$log" 2>/dev/null; then
              awk '/BENCHMARK_JSON_START/{flag=1;next}/BENCHMARK_JSON_END/{flag=0}flag' "$log" > "$out"
            else
              echo '{}' > "$out"
            fi
          }
          extract_json benchmark_with_etw.log benchmark_with_etw.json
          extract_json benchmark_no_etw.log benchmark_no_etw.json

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l7-benchmark-windows-${{ github.run_id }}
          path: |
            benchmark_with_etw.log
            benchmark_no_etw.log
            benchmark_with_etw.json
            benchmark_no_etw.json

      - name: Slack alert on failure
        if: failure()
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: "C072J0U9TH7"
          slack-message: |
            *L7 Attribution Benchmark (windows) failed for ${{ github.repository }}*
            - With ETW: ${{ steps.benchmark_with_etw.outcome }}
            - Without ETW: ${{ steps.benchmark_no_etw.outcome }}
            Branch: ${{ github.ref }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
