# Lima VM configuration for eBPF testing on macOS
# Usage:
#   limactl create --name=ebpf-test Lima.linux-test.yml
#   limactl start ebpf-test
#   limactl shell ebpf-test
#
# Or use the Makefile targets:
#   make lima_create    # Create the VM
#   make lima_start     # Start the VM
#   make lima_test      # Run tests in the VM
#   make lima_stop      # Stop the VM
#   make lima_delete    # Delete the VM

images:
- location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
  arch: "x86_64"
- location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
  arch: "aarch64"

# VM resources - adjust as needed
cpus: 4
memory: "8GiB"
disk: "50GiB"

# Mount the workspace
mounts:
- location: "~"
  writable: true
- location: "/tmp/lima"
  writable: true

# Provisioning script - runs on first boot
provision:
- mode: system
  script: |
    set -eux

    # Update package list
    apt-get update

    # Install build essentials
    apt-get install -y \
      build-essential \
      pkg-config \
      curl \
      wget \
      git \
      jq

    # Install eBPF development tools
    apt-get install -y \
      clang \
      llvm \
      libelf-dev \
      zlib1g-dev \
      libbpf-dev \
      linux-headers-$(uname -r) \
      linux-tools-$(uname -r) \
      linux-tools-common \
      bpfcc-tools

    # Install libpcap for packet capture
    apt-get install -y libpcap-dev

    # Install protobuf compiler
    apt-get install -y protobuf-compiler

    # Install bpftrace for debugging
    apt-get install -y bpftrace || snap install --devmode bpftrace || true

    # Configure kernel for eBPF
    sysctl -w kernel.perf_event_paranoid=-1
    sysctl -w kernel.unprivileged_bpf_disabled=0
    sysctl -w net.core.bpf_jit_enable=1 || true

    # Make kernel settings persistent
    cat >> /etc/sysctl.d/99-ebpf.conf << 'EOF'
    kernel.perf_event_paranoid=-1
    kernel.unprivileged_bpf_disabled=0
    net.core.bpf_jit_enable=1
    EOF

    # Mount debugfs and bpffs (if not already mounted)
    mount -t debugfs none /sys/kernel/debug 2>/dev/null || true
    mount -t bpf none /sys/fs/bpf 2>/dev/null || true

    # Add mounts to fstab for persistence
    grep -q debugfs /etc/fstab || echo "debugfs /sys/kernel/debug debugfs defaults 0 0" >> /etc/fstab
    grep -q bpf /etc/fstab || echo "bpf /sys/fs/bpf bpf defaults 0 0" >> /etc/fstab

    # Install Rust (for the lima user)
    sudo -u $(id -un 1000) bash -c 'curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y'

    echo "eBPF environment setup complete!"
    echo "Kernel version: $(uname -r)"
    echo "Clang version: $(clang --version | head -1)"
    echo "LLVM version: $(llvm-config --version)"

# Message displayed after VM creation
message: |
  eBPF test VM is ready!
  
  To run tests:
    limactl shell ebpf-test
    cd ~/Programming/flodbadd
    make linux_test
  
  Or from macOS:
    make lima_test
