[package]
name = "flodbadd"
version = "1.0.3"
edition = "2021"
authors = ["EDAMAME Technologies"]
description = "Network scanning and session monitoring library"
license = "Apache-2.0"
repository = "https://github.com/edamametechnologies/flodbadd"
keywords = ["network", "scanning", "security", "monitoring", "lan"]
categories = ["network-programming", "system-monitoring"]
links = "flodbadd_npcap"

[lints.rust]
async_fn_in_trait = "allow"

[features]
default = []
asyncpacketcapture = []
packetcapture = [ "pcap", "pnet_packet", "hickory-resolver", "dns-parser", "sysinfo", "netstat2" ]
ebpf = [ "aya", "bytemuck", "nix", "l7_ebpf_program" ]
examples = ["clap", "tracing-subscriber"]

[dependencies]
# Core dependencies
# Local copy in order to allow rapid development/debug
#edamame_backend = { path = "../edamame_backend" }
edamame_backend = { git = "https://github.com/edamametechnologies/edamame_backend.git", branch = "main" }
# Local copy in order to allow rapid development/debug
#undeadlock = { path = "../undeadlock" }
undeadlock = { git = "https://github.com/edamametechnologies/undeadlock", branch = "main" }
# Local copy in order to allow rapid development/debug
#edamame_models = { path = "../edamame_models" }
edamame_models = { git = "https://github.com/edamametechnologies/threatmodels-rs", branch = "main" }

# Global statics w/ mutex
lazy_static = "1.5"
once_cell = "1.21.3"

# JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18.1", features = ["v4", "v5", "fast-rng", "macro-diagnostics"] }

# Hashing
sha2 = "0.10.9"
hex = "0.4.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true }

# Async
parking_lot = "0.12.4"
futures-util = "0.3.31"
tokio = { version = "1", features = ["full"] }
dashmap = "6.1.0"
arc-swap = "1.7"

# Time
chrono = { version = "0.4.42", features = ["serde"] }

# Machine Learning
# extended-isolation-forest = "0.2.3"
# Local copy in order to allow rapid development/debug
#extended-isolation-forest = { path = "../extended-isolation-forest" }
extended-isolation-forest  = { git = "https://github.com/edamametechnologies/extended-isolation-forest", branch = "main" }

# Network utils
socket2 = "0.6.0"
ipnet = "2.11.0"
wez-mdns = { git = "https://github.com/edamametechnologies/mdns" }

# Misc
rand = "0.9.2"
anyhow = "1.0"
regex = "1.11.2"
encoding_rs = "0.8.35"
thiserror = "2.0.16"
serial_test = "3.2.0"
sorted-vec = "0.8.10"

# Strum
strum_macros = "0.27.2"
rayon = "1.11"
futures = "0.3.31"

# Capture dependencies (optional)
pcap = { version = "2.3.0", optional = true, features = ["capture-stream"] }
hickory-resolver = { version = "0.25.2", optional = true }
dns-parser = { git = "https://github.com/edamametechnologies/dns-parser", branch = "pr47", optional = true }
pnet_packet = { version = "0.35.0", optional = true }
sysinfo = { version = "0.37.0", optional = true }
netstat2 = { version = "0.11.2", optional = true }

# Clap dependencies (optional)
clap = { version = "4.5", features = ["derive"], optional = true }

# Linux eBPF (optional) - only for 64-bit architectures (aya doesn't support 32-bit)
[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
aya = { version = "0.13.1", features = ["async_tokio"], optional = true }
bytemuck = { version = "1.23", features = ["derive"], optional = true }
nix = { version = "0.30.1", optional = true, features = [ "user" ] }

# Not WASI/WASIX/WASM
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eui48 = { version = "1.1.0", features = ["disp_hexstring", "serde"] }
macaddr = { version = "1.0.1", features = ["serde"] }
oui = "0.8.1"
csv = "1.3.1"
# Use rustls with ring via reqwest 0.12
reqwest = { version = "0.12.28", default-features = false, features = ["gzip", "blocking", "rustls-tls-webpki-roots"] }

# Platform-specific dependencies
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
network-interface = "2.0.3"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
arp-toolkit = "0.3.2"
users = "0.11.0"

# Windows
[target.'cfg(target_os = "windows")'.dependencies]
powershell_script = "1.1.0"
ctor = "0.6.3"
windows = { version = "0.62.0", features = [ 
    "Data_Xml_Dom", 
    "Win32_Foundation", 
    "Win32_Security", 
    "Win32_System_Threading", 
    "Win32_System_SystemServices", 
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging", 
    "Win32_NetworkManagement", 
    "Win32_NetworkManagement_IpHelper", 
    "Win32_Networking", 
    "Win32_Networking_WinSock", 
    "Win32_NetworkManagement_Ndis", 
    "Win32_NetworkManagement_NetManagement" 
] }
zip = "7.1.0"

[dev-dependencies]
criterion = "0.8.1"
tempfile = "3.22"
mockall = "0.14.0"

[build-dependencies]
# Npcap
# Use rustls with ring via reqwest 0.12
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
zip = "7.1.0"

# eBPF program build component (optional)
l7_ebpf_program = { path = "ebpf/l7_ebpf_program", optional = true, features = ["ebpf"] }

# Windows build-dependencies for Npcap auto-install
[target.'cfg(target_os = "windows")'.build-dependencies]
windows = { version = "0.62.0", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader"
] }

[[example]]
name = "lan_scan"
required-features = ["examples"]

[[example]]
name = "capture_sessions"
required-features = ["examples"]

[[example]]
name = "whitelist_management"
required-features = ["examples"]

[[example]]
name = "session_analyzer"
required-features = ["examples"]

[lib]
name = "flodbadd"
path = "src/lib.rs" 
